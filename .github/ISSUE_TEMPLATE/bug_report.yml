name: Bug Report
description: Report incorrect or unexpected VGR behavior
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. VGR is under active,
        single-maintainer development — see [Project Status](../../blob/main/CONTRIBUTING.md#project-status)
        for current contribution policy.

  - type: input
    id: vgr-version
    attributes:
      label: VGR Version
      description: Output of `vgr --version`
      placeholder: "e.g. 1.2.0"
    validations:
      required: true

  - type: input
    id: python-version
    attributes:
      label: Python Version
      description: Output of `python --version`
      placeholder: "e.g. 3.12.4"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - Linux
        - macOS
        - Windows
        - Other (specify in Additional Context)
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Minimal Reproduction
      description: >
        A minimal `.vgr` script that reproduces the issue. Strip it down as
        far as you can — smaller reproductions get fixed faster.
      render: text
      placeholder: |
        Define Function Foo(x)
            Return x + 1
        End Function

        Print @Foo(41)
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: Include full error output or traceback, if any.
      render: text
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Anything else relevant — when it started, workarounds tried, related issues.
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues for a duplicate before opening this one
          required: true
        - label: I confirmed this reproduces against the current `main` branch
          required: true
