name: Auto Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  test-build-release:
    runs-on: ubuntu-slim
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.9'
      - run:  python -m pip install -r requirements-dev.txt
      - run:  ./scripts/test
      - run:  ./scripts/build "${GITHUB_REF_NAME}"
      - run:  echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: false
          name: ${{ github.ref_name }}
          body_path: ./dist/vgr-${{ env.VERSION }}-RELEASE-NOTES.md
          files: ./dist/*
