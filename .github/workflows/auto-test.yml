name: Auto Test

on:
  workflow_dispatch:
  schedule:
    - cron: '36 6 * * 1,3,5'
  push:
    paths:
      - "pyproject.toml"
      - "scripts/test"
      - "tests/**"
      - ".github/workflows/auto-test.yml"

jobs:
  test:
    runs-on: ubuntu-slim
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.9'
      - run: python -m pip install ".[dev]"
      - run: ./scripts/test --cov-report=html
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: htmlcov/
          retention-days: 14
      - run: pylint src/vgr --output-format=text > pylint-report.txt
      - uses: actions/upload-artifact@v4
        with:
          name: pylint-report
          path: pylint-report.txt
          retention-days: 14
