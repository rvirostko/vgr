name: Auto Test

on:
  schedule:
    - cron: '0 6 * * 1,3,5'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-slim
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.9'
      - run: python -m pip install ".[dev]"
      - run: ./scripts/test --cov-report=term
